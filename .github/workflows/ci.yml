name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias (reproducible, usa package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (usa MongoDB en memoria, no requiere servicios externos)
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci_test_secret
